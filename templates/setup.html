{% extends "base.html" %}
{% block title %}Create admin · Discwatch{% endblock %}
{% block body %}
<h2>Create the first admin</h2>
<p class="muted">No users yet. This account can add other people under Users. Existing tracked titles move onto this list.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" style="max-width:360px;display:flex;flex-direction:column;gap:10px">
  <input name="username" placeholder="Username" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" required>
  <button type="submit">Create admin</button>
</form>
{% endblock %}
